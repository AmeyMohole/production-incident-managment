<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileGuard</title>
<style>
  :root {
    --bg: #f3f6f8; --surface: #fff; --ink: #12202a; --muted: #53636e; --line: #d6dfe4;
    --accent: #0a6c8c; --accent-soft: #e1f0f5;
    --ok: #1b7a4b; --ok-soft: #ddf3e7; --bad: #b3261e; --bad-soft: #fbe4e2; --warn: #84560a; --warn-soft: #faeed2;
    --mono: ui-monospace, Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d151a; --surface: #142028; --ink: #e5edf1; --muted: #93a4af; --line: #263640;
      --accent: #52b8d8; --accent-soft: #12303b;
      --ok: #5cc48f; --ok-soft: #12301f; --bad: #ff8f86; --bad-soft: #3a1816; --warn: #e6b65a; --warn-soft: #33270e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 64px; display: grid; gap: 24px; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.01em; }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  p { margin: 0; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
  .drop { border: 2px dashed var(--line); border-radius: 6px; padding: 36px 16px; text-align: center; cursor: pointer; display: grid; gap: 6px; }
  .drop.over, .drop:hover, .drop:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  .drop b { font-size: 1.05rem; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; padding: 8px 14px; }
  button.secondary { background: transparent; color: var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .result { display: grid; gap: 8px; }
  .pill { display: inline-block; font: 600 0.75rem/1 var(--mono); letter-spacing: 0.06em; padding: 6px 9px; border-radius: 3px; border: 1px solid transparent; }
  .PENDING { background: var(--bg); color: var(--muted); border-color: var(--line); }
  .SCANNING { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .CLEAN { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .INFECTED { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .ERROR { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .mono { font-family: var(--mono); font-size: 0.82rem; word-break: break-all; color: var(--muted); }
  progress { width: 100%; accent-color: var(--accent); }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>FileGuard</h1>
    <p>Upload a file to check it for viruses. Files are scanned with ClamAV.</p>
  </header>

  <section class="card">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a file to scan">
      <b>Drop a file here or click to choose</b>
      <span class="mono" id="limit">Maximum size 25 MB</span>
    </div>
    <input type="file" id="file" hidden>
    <div class="row" style="margin-top:14px">
      <button class="secondary" id="eicar" type="button">Scan the EICAR test virus</button>
      <span class="mono">Harmless standard test file. Built in your browser, never saved to disk.</span>
    </div>
  </section>

  <section class="card result" id="result" hidden aria-live="polite">
    <h2 id="r-name"></h2>
    <progress id="r-progress" max="100" value="0" hidden></progress>
    <div class="row"><span class="pill" id="r-status"></span><span id="r-detail"></span></div>
    <div class="mono" id="r-hash" hidden></div>
  </section>

  <section class="card">
    <h2>Recent scans</h2>
    <div class="table">
      <table>
        <thead><tr><th>File</th><th>Size</th><th>Result</th><th>When</th></tr></thead>
        <tbody id="history"><tr><td colspan="4" class="mono">No scans yet.</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const MAX_MB = 25;
$('limit').textContent = 'Maximum size ' + MAX_MB + ' MB';

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function show(name, status, detail) {
  $('result').hidden = false;
  $('r-name').textContent = name;
  $('r-status').textContent = status;
  $('r-status').className = 'pill ' + status;
  $('r-detail').textContent = detail || '';
}

async function upload(file) {
  $('r-hash').hidden = true;
  if (file.size === 0) return show(file.name, 'ERROR', 'The file is empty.');
  if (file.size > MAX_MB * 1048576) return show(file.name, 'ERROR', 'File is larger than ' + MAX_MB + ' MB.');
  show(file.name, 'PENDING', 'Requesting upload link');

  let created;
  try {
    const r = await fetch('/uploads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, size: file.size, content_type: file.type || 'application/octet-stream' }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    created = await r.json();
  } catch (e) { return show(file.name, 'ERROR', e.message); }

  // Send the file straight to S3 with the presigned form. The file field must come last.
  const form = new FormData();
  Object.entries(created.upload.fields).forEach(([k, v]) => form.append(k, v));
  form.append('file', file);
  show(file.name, 'PENDING', 'Uploading');
  $('r-progress').hidden = false; $('r-progress').value = 0;
  try {
    await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('POST', created.upload.url);
      x.upload.onprogress = (e) => { if (e.lengthComputable) $('r-progress').value = (e.loaded / e.total) * 100; };
      x.onload = () => (x.status >= 200 && x.status < 300 ? resolve() : reject(new Error('Upload rejected (' + x.status + ')')));
      x.onerror = () => reject(new Error('Upload failed. Is S3 reachable at ' + created.upload.url + '?'));
      x.send(form);
    });
  } catch (e) { $('r-progress').hidden = true; return show(file.name, 'ERROR', e.message); }
  $('r-progress').hidden = true;
  poll(created.scan_id, file.name);
}

async function poll(id, name) {
  show(name, 'SCANNING', 'Waiting for the scanner');
  for (let i = 0; i < 150; i++) {
    const s = await (await fetch('/scans/' + id)).json();
    if (s.status === 'CLEAN') { show(name, 'CLEAN', 'No virus found in ' + (s.scan_seconds || '?') + ' s'); done(s); return; }
    if (s.status === 'INFECTED') { show(name, 'INFECTED', 'Virus found: ' + s.signature); done(s); return; }
    if (s.status === 'ERROR') { show(name, 'ERROR', s.error || 'Scan failed'); done(s); return; }
    if (s.status === 'SCANNING') show(name, 'SCANNING', 'Scanning');
    await new Promise((r) => setTimeout(r, 2000));
  }
  show(name, 'ERROR', 'Timed out waiting for the scanner. Is the worker running?');
}
function done(s) {
  if (s.sha256) { $('r-hash').hidden = false; $('r-hash').textContent = 'SHA-256 ' + s.sha256; }
  loadHistory();
}

async function loadHistory() {
  try {
    const rows = await (await fetch('/scans?limit=10')).json();
    $('history').innerHTML = rows.length ? rows.map((s) =>
      '<tr><td>' + esc(s.filename) + '</td><td>' + fmtSize(s.size) + '</td><td><span class="pill ' + s.status + '">' + s.status +
      '</span>' + (s.signature ? ' <span class="mono">' + esc(s.signature) + '</span>' : '') + '</td><td>' +
      new Date(s.created_at * 1000).toLocaleString() + '</td></tr>').join('')
      : '<tr><td colspan="4" class="mono">No scans yet.</td></tr>';
  } catch (e) { /* leave the table as it is */ }
}

// File picking
const drop = $('drop'), input = $('file');
drop.addEventListener('click', () => input.click());
drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
input.addEventListener('change', () => { if (input.files[0]) upload(input.files[0]); input.value = ''; });
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

// The EICAR string is assembled from pieces so this page is not itself flagged by antivirus.
$('eicar').addEventListener('click', () => {
  const s = ['X5O!P%@AP[4\\PZX54(P^)7CC)7}$', 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!', '$H+H*'].join('');
  upload(new File([s], 'eicar-test.txt', { type: 'text/plain' }));
});

loadHistory();
</script>
</body>
</html>
